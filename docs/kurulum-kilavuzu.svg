ılmıyor: mobil veriyi kapat, HTTP yaz.</text><text x="97" y="849" font-family="'DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#f5f8ff">Serial Monitor: 115200 baud   |   Tuş kontrolü 600 ms komut kesilince durur.</text></svg>